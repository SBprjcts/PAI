<div class="dashboard-container">
  <!-- Sidebar -->
  <nav class="sidebar">
    <a class="logo" routerLink="/dashboard"><img src="logo2.png" alt="Logo" class="logo" /></a>

    <ul class="nav-links">
      <li><a routerLink="/input-earnings" routerLinkActive="active">Input Earnings</a></li>
      <li><a routerLink="/expenses" routerLinkActive="active">Expenses</a></li>
      <li><a routerLink="/categorization" routerLinkActive="active">Automated Bill Categorization</a></li>
      <li><a routerLink="/forecasting" routerLinkActive="active">Predictive Cash Flow Forecasting</a></li>
      <li><a routerLink="/ead" routerLinkActive="active" class="active">Expense Anomaly Detection</a></li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <div class="main-content">
    <div class="dashboard-wrapper">
      <h2 class="title">Anomalous Expenses</h2>

      <div class="expense-card" *ngFor="let exp of expenses">
        <div class="indicator" [ngClass]="getSeverityColor(exp.anomalyScore)"></div>

        <div class="expense-details">
          <div class="top-row">
            <span class="vendor">{{ exp.vendor }}</span>
            <span class="amount">${{ exp.amount.toFixed(2) }}</span>
          </div>

          <div class="middle-row">
            <span class="date">{{ exp.date }}</span>
            <span class="category">{{ exp.category }}</span>
            <span class="score">Anomaly Score: {{ exp.anomalyScore }}%</span>
          </div>

          <div class="bottom-row">
            <p class="description">{{ exp.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
